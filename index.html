<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — GSD</title>
<meta name="description" content="Sign in to GSD.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23f6f2ea'/><text x='50' y='66' text-anchor='middle' font-family='Inter,system-ui,sans-serif' font-size='52' font-weight='800' fill='%231a1714'>GSD<tspan fill='%23b82d3b'>.</tspan></text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Design tokens — synced with app.css "Lifestyle" palette. */
  :root {
    --bg:           #f6f2ea;
    --surface:      #ffffff;
    --surface-2:    #f0eadd;
    --edge:         #ddd6c7;
    --edge-strong:  #c8bfae;
    --ink:          #1a1714;
    --ink-2:        #3d3730;
    --ink-3:        #6e6559;
    --ink-4:        #a8a094;
    --guava-50:     #fbeaec;
    --guava-100:    #fde8ea;
    --guava-500:    #d65b6b;
    --guava-700:    #b82d3b;
    --guava-800:    #99232f;
    --r-md: 4px;
    --r-lg: 10px;
    --shadow-card:    0 1px 2px rgba(20,15,10,.04), 0 4px 16px rgba(20,15,10,.06);
    --shadow-raised:  0 8px 28px rgba(20,15,10,.10), 0 2px 6px rgba(20,15,10,.06);
    --shadow-focus:   0 0 0 3px rgba(184,45,59,.18);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, -apple-system, Segoe UI, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    /* Subtle vignette so the card lifts off the warm cream background. */
    background-image:
      radial-gradient(ellipse at top, rgba(255,255,255,.55), transparent 60%),
      radial-gradient(ellipse at bottom, rgba(184,45,59,.04), transparent 70%);
  }

  .login-shell {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Wordmark above the card — matches the in-app sidebar/header logo style. */
  .brand {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 0;
    margin-bottom: 22px;
    user-select: none;
  }
  .brand-word {
    font-size: 38px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--ink);
    line-height: 1;
  }
  .brand-dot {
    font-size: 38px;
    font-weight: 800;
    color: var(--guava-700);
    line-height: 1;
    font-style: normal;
  }

  .card {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--edge);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-raised);
    padding: 32px 32px 24px;
  }

  .card-heading {
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 6px;
    letter-spacing: -0.01em;
  }
  .card-sub {
    font-size: 13px;
    color: var(--ink-3);
    margin-bottom: 22px;
  }

  .btn-google {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--edge-strong);
    border-radius: var(--r-md);
    padding: 11px 14px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
  }
  .btn-google:hover { background: var(--surface-2); border-color: var(--ink-4); }
  .btn-google:focus-visible { outline: none; box-shadow: var(--shadow-focus); border-color: var(--guava-500); }
  .btn-google:disabled { opacity: 0.6; cursor: progress; }
  .btn-google svg { width: 18px; height: 18px; flex-shrink: 0; }

  .auth-error {
    margin-top: 14px;
    padding: 10px 12px;
    background: var(--guava-50);
    color: var(--guava-800);
    border: 1px solid var(--guava-100);
    border-radius: var(--r-md);
    font-size: 12.5px;
    line-height: 1.5;
    display: none;
  }
  .auth-error.is-visible { display: block; }

  .auth-redirecting {
    margin-top: 14px;
    color: var(--ink-3);
    font-size: 12.5px;
    text-align: center;
    display: none;
  }
  .auth-redirecting.is-visible { display: block; }

  .legal-footer {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--edge);
    font-size: 11.5px;
    color: var(--ink-4);
    text-align: center;
    line-height: 1.55;
  }
  .legal-footer a {
    color: var(--ink-3);
    text-decoration: underline;
    text-underline-offset: 2px;
    text-decoration-color: var(--edge-strong);
    transition: color 0.12s ease;
  }
  .legal-footer a:hover { color: var(--ink); }

  .below-card {
    margin-top: 18px;
    font-size: 11.5px;
    color: var(--ink-4);
    text-align: center;
  }
  .below-card a { color: var(--ink-3); text-decoration: none; }
  .below-card a:hover { color: var(--ink); text-decoration: underline; }

  /* Skeleton for the brief moment between "already signed in" detection and
     the redirect actually landing — prevents a flash of the login card. */
  body.is-redirecting .login-shell .card,
  body.is-redirecting .login-shell .legal-footer,
  body.is-redirecting .login-shell .below-card { visibility: hidden; }

  @media (max-width: 420px) {
    body { padding: 16px; }
    .card { padding: 26px 22px 20px; }
    .brand-word, .brand-dot { font-size: 34px; }
  }
</style>
</head>
<body>
  <main class="login-shell" role="main">
    <div class="brand" aria-label="GSD">
      <span class="brand-word">GSD</span><em class="brand-dot">.</em>
    </div>
    <section class="card" aria-labelledby="card-heading">
      <h1 id="card-heading" class="card-heading">Welcome back</h1>
      <p class="card-sub">Sign in to pick up where you left off.</p>

      <button class="btn-google" id="btnGoogleSignIn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        <span id="btnGoogleSignInLabel">Continue with Google</span>
      </button>

      <div class="auth-error" id="authError" role="alert"></div>
      <div class="auth-redirecting" id="authRedirecting">Signing you in…</div>

      <div class="legal-footer">
        By signing in, you agree to our
        <a href="/app#terms" id="termsLink">Terms</a>
        and
        <a href="/app#privacy" id="privacyLink">Privacy Policy</a>.
      </div>
    </section>
    <div class="below-card">
      Need help? <a href="mailto:support@gsdtasks.com">support@gsdtasks.com</a>
    </div>
  </main>

  <!-- Supabase client — same project as the app. Used only for session detection
       so a returning, already-signed-in user gets bounced straight through. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ── Supabase init (read from the same hardcoded project as the app). ──
    const SUPABASE_URL = 'https://dmuwncwptvnnlizuxhta.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_IAw1Nc8XezPPWos8iS-kLg_YrNpRIe_';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
    });

    // ── Sign-in target ──
    // Phase 3 / Stage 2: beta promoted to canonical /app.
    const SIGNED_IN_TARGET = '/app';

    // ── Google OAuth — same flow as beta/src/01-core.js signInWithGoogle. ──
    // The beta-auth Netlify function expects this client_id + scope set, then
    // redirects to /app#id_token=... once token exchange succeeds.
    const BETA_GOOGLE_CLIENT_ID = '508677465416-ptiaqbjlqq8cmf8f1gertead6493u7ei.apps.googleusercontent.com';
    const GOOGLE_SCOPES = [
      'openid', 'email', 'profile',
      'https://www.googleapis.com/auth/calendar.readonly',
      'https://www.googleapis.com/auth/calendar.events.owned',
      'https://www.googleapis.com/auth/calendar.events.owned.readonly',
      'https://www.googleapis.com/auth/tasks',
      'https://www.googleapis.com/auth/drive',
    ].join(' ');

    function startGoogleSignIn() {
      const btn   = document.getElementById('btnGoogleSignIn');
      const label = document.getElementById('btnGoogleSignInLabel');
      const errEl = document.getElementById('authError');
      errEl.classList.remove('is-visible');
      btn.disabled = true;
      label.textContent = 'Redirecting to Google…';

      const state = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : Math.random().toString(36).slice(2);
      try { sessionStorage.setItem('beta_oauth_state', state); } catch (_) {}

      const params = new URLSearchParams({
        client_id:     BETA_GOOGLE_CLIENT_ID,
        redirect_uri:  window.location.origin + '/.netlify/functions/beta-auth',
        response_type: 'code',
        scope:         GOOGLE_SCOPES,
        access_type:   'offline',
        prompt:        'consent',
        state,
      });
      window.location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + params;
    }

    // ── Already-signed-in fast path ──
    // If we already have an active Supabase session, jump straight to the app
    // so a returning user never has to click through this screen. Done before
    // first paint via a sync class swap so the card doesn't flash.
    async function bounceIfAuthed() {
      try {
        const { data: { session } } = await sb.auth.getSession();
        if (session && session.user) {
          document.body.classList.add('is-redirecting');
          document.getElementById('authRedirecting').classList.add('is-visible');
          window.location.replace(SIGNED_IN_TARGET);
          return true;
        }
      } catch (_) { /* offline or transient — fall through to login card */ }
      return false;
    }

    // ── URL-hash error surfacing ──
    // beta-auth bounces failed OAuth back here with #error=... so we can show
    // the user what went wrong (rare, but better than a silent failure).
    function surfaceHashError() {
      if (!location.hash.includes('error=')) return;
      const params = new URLSearchParams(location.hash.slice(1));
      const err = params.get('error');
      if (!err) return;
      const map = {
        token_exchange_failed: 'Google sign-in failed. Please try again.',
        server_misconfiguration: 'Authentication service is unavailable. Try again in a moment.',
        access_denied: 'Sign-in was cancelled.',
      };
      const msg = map[err] || `Sign-in error: ${decodeURIComponent(err)}`;
      const errEl = document.getElementById('authError');
      errEl.textContent = msg;
      errEl.classList.add('is-visible');
      // Strip the hash so a refresh doesn't keep showing the error.
      history.replaceState(null, '', window.location.pathname + window.location.search);
    }

    document.getElementById('btnGoogleSignIn').addEventListener('click', startGoogleSignIn);

    // Boot: surface any error from the redirect, then check session.
    surfaceHashError();
    bounceIfAuthed();
  </script>
</body>
</html>
