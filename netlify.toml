[build.environment]
  # SUPABASE_URL is the public project endpoint and is intentionally
  # hardcoded in src/01-core.js / beta/src/01-core.js — every browser
  # request needs it. RLS + the JWT enforce auth; the URL alone is not
  # sensitive. Same for SUPABASE_KEY which is the publishable/anon key.
  # Skip Netlify's secret scanner for these so prod deploys don't fail.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_KEY"

[[redirects]]
  from = "/app/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/beta/app/*"
  to = "/beta/app.html"
  status = 200

[[redirects]]
  from = "/beta/app"
  to = "/beta/app.html"
  status = 200

[[redirects]]
  from = "/beta"
  to = "/beta/app.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/app.html"
  status = 200

# Daily Whoop + Oura sync. 04:00 UTC = late evening US, so prior-day metrics
# have finalized in both vendor APIs by the time we pull.
[functions."cron-health-sync"]
  schedule = "0 4 * * *"

# Daily-brief cache warmer. Phase 1.8 "Tier 2 realtime" — hourly across the
# full day. The function itself filters per user by local hour (06-22) and
# lets beta-daily-brief.js derive morning vs evening mode from the user's
# timezone, so we cover both modes across all US/EU timezones with one cron
# expression. Each tick upserts onto the same (user_id, brief_date, mode)
# row — no duplicate rows accumulate.
#
# Required env vars (set in Netlify dashboard):
#   ANTHROPIC_API_KEY       Anthropic key for Claude calls (required)
#   INTERNAL_FN_SECRET      Shared secret for function-to-function auth
#                           (already set; reused from cron-health-sync)
# Optional env vars:
#   BRIEF_MODEL             Model ID (default: claude-opus-4-7).
#                           Set to claude-sonnet-4-6 for ~5x cheaper briefs
#                           if quality holds for your use case.
#   BRIEF_MAX_TOKENS        Max output tokens for each brief (default: 1500).
[functions."cron-daily-brief"]
  schedule = "0 * * * *"
