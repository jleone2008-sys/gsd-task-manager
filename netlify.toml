[build]
  # Strips the committed dev mock-mode <script> block from app.html on
  # production deploys only (Gate 3). No-op on preview/branch/local builds.
  # Publish dir stays the repo root (Netlify default when unset); functions
  # are still auto-detected from netlify/functions.
  command = "node scripts/inject-dev-mode.mjs"

[build.environment]
  # SUPABASE_URL is the public project endpoint and is intentionally
  # hardcoded in beta/src/01-core.js — every browser request needs it.
  # RLS + the JWT enforce auth; the URL alone is not sensitive. Same
  # for SUPABASE_KEY which is the publishable/anon key. Skip Netlify's
  # secret scanner for these so prod deploys don't fail.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_KEY"

# Canonical app — what was at /beta/app is now here.
[[redirects]]
  from = "/app/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

# Old beta URLs 301 to the canonical app. URL fragments (#hash) are preserved
# across the redirect by browsers, so OAuth callbacks coming back to
# /beta/app#id_token=... still land correctly at /app#id_token=...
[[redirects]]
  from = "/beta/app/*"
  to = "/app/:splat"
  status = 301

[[redirects]]
  from = "/beta/app"
  to = "/app"
  status = 301

[[redirects]]
  from = "/beta"
  to = "/app"
  status = 301

[[redirects]]
  from = "/admin"
  to = "/admin/app.html"
  status = 200

# Daily Whoop + Oura sync. 04:00 UTC = late evening US, so prior-day metrics
# have finalized in both vendor APIs by the time we pull.
[functions."cron-health-sync"]
  schedule = "0 4 * * *"

# Daily-brief cache warmer. Phase 1.8 "Tier 2 realtime" — hourly across the
# full day. The function itself filters per user by local hour (06-22) and
# lets beta-daily-brief.js derive morning vs evening mode from the user's
# timezone, so we cover both modes across all US/EU timezones with one cron
# expression. Each tick upserts onto the same (user_id, brief_date, mode)
# row — no duplicate rows accumulate.
#
# Required env vars (set in Netlify dashboard):
#   ANTHROPIC_API_KEY       Anthropic key for Claude calls (required)
#   INTERNAL_FN_SECRET      Shared secret for function-to-function auth
#                           (already set; reused from cron-health-sync)
# Optional env vars:
#   BRIEF_MODEL             Model ID (default: claude-opus-4-8 — best model;
#                           the hourly tick now only calls Claude when the
#                           brief's inputs actually changed, so quality per
#                           call matters more than volume).
#                           Set to claude-sonnet-4-6 for ~5x cheaper briefs
#                           if quality holds for your use case.
#   BRIEF_MAX_TOKENS        Max output tokens for each brief (default: 1500).
# NOTE: the tick stays hourly, but each call sends refresh_if_stale — Claude
# runs only when the input claim-set fingerprint changed (≈2-5 gens/user/day).
[functions."cron-daily-brief"]
  schedule = "0 * * * *"

# Phase 9 — per-user weather snapshot. Hourly tick; the function filters
# each user by local hour and only writes when it's 05:00 in their tz, so
# one cron covers every timezone the same way cron-daily-brief does. Writes
# today + tomorrow into weather_daily so the evening brief gets a cache
# hit on tomorrow's forecast without paying a live Open-Meteo call.
#
# No env vars beyond SUPABASE_SERVICE_KEY (Open-Meteo has no API key).
[functions."cron-weather-snapshot"]
  schedule = "0 * * * *"

# Phase 7 — weekly synthesis. Sundays at 22:00 UTC = early-evening US Eastern /
# afternoon US Pacific. Close enough to "Sunday evening user-local" for v1.
# Per-user-local firing would need a more elaborate scheduler.
#
# The function iterates active users and triggers
# beta-weekly-synthesis-background per user (fire-and-forget; each background
# fn runs up to 15 minutes).
#
# Required env vars:
#   ANTHROPIC_API_KEY        shared with brief
#   OPENAI_API_KEY           shared with knowledge ingest (needed for the
#                            search_knowledge tool in the agentic loop)
#   CRON_SECRET              Bearer the background fn validates on cron-path
#                            calls (separate from the JWT path for manual
#                            triggers from the Insights "Generate" button).
[functions."cron-weekly-synthesis"]
  schedule = "0 22 * * 0"

# Phase 10 — per-user nightly evaluator for brief recommendations.
# Hourly tick; the function filters per user by local hour and only does
# work when it's 23:00 in their tz. Three jobs per user per fire:
#   (1) score adherence for yesterday's recommendations from downstream
#       data (today's oura sleep, today's workout logs, today's habit
#       completions, today's journal)
#   (2) fill T+1 outcome for yesterday's brief
#   (3) fill T+3 outcome for 3-days-ago brief; mark computed_at
# After each fire that did work, refreshes v_user_action_efficacy via
# the refresh_efficacy_view RPC (security-definer wrapper).
#
# No env vars beyond SUPABASE_SERVICE_KEY.
[functions."cron-evaluate-actions"]
  schedule = "0 * * * *"
